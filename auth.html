<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Highest Data Hub — Authentication</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth-styles.css" />
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card glass">
      <div class="auth-header">
        <a class="brand" href="index.html">Highest Data Hub<span>•</span></a>
        <p class="auth-tagline">Secure data bundles for resellers</p>
      </div>

      <div class="auth-tabs">
        <button id="tabLogin" class="tab-btn active" data-tab="login">Login</button>
        <button id="tabSignup" class="tab-btn" data-tab="signup">Sign up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form active" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" required>
        </div>
        <div class="form-row">
          <label class="checkbox-label">
            <input id="rememberMe" type="checkbox">
            <span>Remember me</span>
          </label>
          <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn primary" style="width:100%">Login</button>
        <div id="loginStatus" class="status-msg"></div>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input id="signup-name" type="text" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirm Password</label>
          <input id="signup-confirm" type="password" placeholder="••••••••" required>
        </div>
        <label class="checkbox-label">
          <input id="termsAgree" type="checkbox" required>
          <span>I agree to terms and conditions</span>
        </label>
        <button type="submit" class="btn primary" style="width:100%">Create Account</button>
        <div id="signupStatus" class="status-msg"></div>
      </form>

      <!-- Forgot Password Form -->
      <form id="resetForm" class="auth-form" style="display:none" novalidate>
        <p class="muted small" style="margin-bottom:.8rem">Enter your email and we'll send a reset link.</p>
        <div class="form-group">
          <label for="reset-email">Email</label>
          <input id="reset-email" type="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn primary" style="width:100%">Send Reset Link</button>
        <button type="button" id="backToLogin" class="btn ghost" style="width:100%;margin-top:.5rem">Back to Login</button>
        <div id="resetStatus" class="status-msg"></div>
      </form>
    </div>

    <div class="auth-footer">
      <p class="muted small">© <span id="year"></span> Highest Data Hub • Secure authentication</p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB3tiRGkbivshcU9S47DWxM7RtvQ9c5CB0",
      authDomain: "highestdatahub.firebaseapp.com",
      databaseURL: "https://highestdatahub-default-rtdb.firebaseio.com",
      projectId: "highestdatahub",
      storageBucket: "highestdatahub.firebasestorage.app",
      messagingSenderId: "701655732378",
      appId: "1:701655732378:web:1012fd0f67d67fa1f5cf23",
      measurementId: "G-T5VKNKVDPS"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function generateReferralCode() {
      return 'REF' + Math.random().toString(36).substring(2, 10).toUpperCase();
    }

    const tabLogin = document.getElementById('tabLogin');
    const tabSignup = document.getElementById('tabSignup');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const resetForm = document.getElementById('resetForm');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const backToLogin = document.getElementById('backToLogin');
    const rememberMe = document.getElementById('rememberMe');
    const loginStatus = document.getElementById('loginStatus');
    const signupStatus = document.getElementById('signupStatus');
    const resetStatus = document.getElementById('resetStatus');

    function showForm(formId) {
      loginForm.classList.remove('active');
      signupForm.classList.remove('active');
      resetForm.style.display = 'none';
      if (formId === 'login') { loginForm.classList.add('active'); tabLogin.classList.add('active'); tabSignup.classList.remove('active'); }
      else if (formId === 'signup') { signupForm.classList.add('active'); tabSignup.classList.add('active'); tabLogin.classList.remove('active'); }
      else if (formId === 'reset') { resetForm.style.display = 'block'; tabLogin.classList.remove('active'); tabSignup.classList.remove('active'); }
    }

    tabLogin.addEventListener('click', () => showForm('login'));
    tabSignup.addEventListener('click', () => showForm('signup'));
    forgotPasswordLink.addEventListener('click', (e) => { e.preventDefault(); showForm('reset'); });
    backToLogin.addEventListener('click', (e) => { e.preventDefault(); showForm('login'); });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = rememberMe.checked;

      loginStatus.textContent = 'Logging in...';
      loginStatus.className = 'status-msg';

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        if (remember) localStorage.setItem('rememberEmail', email);
        loginStatus.textContent = 'Success! Redirecting...';
        loginStatus.className = 'status-msg success';
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        let errorMsg = 'Login failed';
        
        if (err.code === 'auth/user-not-found') {
          errorMsg = 'Email not found. Please sign up to create an account.';
        } else if (err.code === 'auth/wrong-password') {
          errorMsg = 'Wrong password. Please try again.';
        } else if (err.code === 'auth/invalid-email') {
          errorMsg = 'Invalid email address.';
        } else if (err.code === 'auth/user-disabled') {
          errorMsg = 'This account has been disabled.';
        } else if (err.code === 'auth/too-many-requests') {
          errorMsg = 'Too many login attempts. Please try again later.';
        }
        
        loginStatus.textContent = errorMsg;
        loginStatus.className = 'status-msg error';
      }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const terms = document.getElementById('termsAgree').checked;

      if (password !== confirm) { signupStatus.textContent = 'Passwords do not match'; signupStatus.className = 'status-msg error'; return; }
      if (!terms) { signupStatus.textContent = 'Please agree to terms'; signupStatus.className = 'status-msg error'; return; }

      signupStatus.textContent = 'Creating account...';
      signupStatus.className = 'status-msg';

      try {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        const uid = result.user.uid;

        await db.ref('users/' + uid).set({
          id: uid,
          email,
          name,
          balance: 0,
          referral_code: generateReferralCode(),
          referral_earnings: 0,
          createdAt: new Date().toISOString()
        });

        signupStatus.textContent = 'Account created! Redirecting...';
        signupStatus.className = 'status-msg success';
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        let errorMsg = 'Signup failed';
        
        if (err.code === 'auth/email-already-in-use') {
          errorMsg = 'Email already registered. Please login instead.';
        } else if (err.code === 'auth/weak-password') {
          errorMsg = 'Password is too weak. Use at least 6 characters.';
        } else if (err.code === 'auth/invalid-email') {
          errorMsg = 'Invalid email address.';
        }
        
        signupStatus.textContent = errorMsg;
        signupStatus.className = 'status-msg error';
      }
    });

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();
      
      if (!email) {
        resetStatus.textContent = 'Please enter your email';
        resetStatus.className = 'status-msg error';
        return;
      }

      resetStatus.textContent = 'Sending reset link...';
      resetStatus.className = 'status-msg';

      try {
        await auth.sendPasswordResetEmail(email);
        resetStatus.textContent = '✓ Reset link sent! Check your email.';
        resetStatus.className = 'status-msg success';
        document.getElementById('reset-email').value = '';
        setTimeout(() => showForm('login'), 2000);
      } catch (err) {
        resetStatus.textContent = err.message || 'Failed to send reset email';
        resetStatus.className = 'status-msg error';
      }
    });

    checkAuthStatus();

    function checkAuthStatus() {
      auth.onAuthStateChanged((user) => {
        if (user) {
          window.location.href = 'index.html';
        } else {
          const saved = localStorage.getItem('rememberEmail');
          if (saved) document.getElementById('login-email').value = saved;
        }
      });
    }

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
